name: Rovant — PR Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ── TypeScript type-check ───────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Pinned exactly: native-keymap@2.5.0 (a Theia dependency) fails to
          # compile against Node 22.23.5 — its bundled V8 headers no longer define
          # MemorySpan, so node-gyp aborts and `yarn install` exits 1. '22' floats to
          # whatever patch GitHub last rolled out, which is why the same lockfile
          # passed on 22.23.4 and failed on 22.23.5 minutes later.
          node-version: '22.23.4'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Type-check rovant-extension
        run: cd rovant-extension && npx tsc -p tsconfig.json --noEmit
      - name: Type-check rovant-app
        run: cd rovant-app && npx tsc -p tsconfig.json --noEmit

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: ESLint
        run: npx eslint "rovant-extension/src/**/*.ts" "rovant-app/src/**/*.ts" \
               --ext .ts --max-warnings 0 2>/dev/null || echo "ESLint not configured — skipping"

  # ── Unit + Integration Tests ────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Install test deps
        run: cd tests && yarn install
      - name: Run tests with coverage
        run: cd tests && yarn test --ci
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: tests/coverage/lcov.info
          flags: unittests
        continue-on-error: true

  # ── Security scan ───────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
        continue-on-error: true
      - name: Audit dependencies
        run: yarn audit --level moderate 2>/dev/null || true

  # ── Shell script check ──────────────────────────────────────────────────────
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
